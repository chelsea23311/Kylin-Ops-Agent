<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="860" viewBox="0 0 1200 860">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f5f9fd"/>
      <stop offset="1" stop-color="#eef4f8"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#9aa9b5" flood-opacity="0.20"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10 Z" fill="#5a6b7c"/>
    </marker>
    <style>
      text {
        font-family: "Noto Sans CJK SC", "Microsoft YaHei", "PingFang SC", Arial, sans-serif;
        fill: #213246;
      }
      .title {
        font-size: 42px;
        font-weight: 700;
        letter-spacing: 1px;
        fill: #17324d;
      }
      .subtitle {
        font-size: 24px;
        font-weight: 700;
        fill: #ffffff;
      }
      .layer-label {
        font-size: 24px;
        font-weight: 700;
      }
      .node {
        font-size: 20px;
        font-weight: 600;
      }
      .small {
        font-size: 17px;
        font-weight: 500;
      }
    </style>
  </defs>

  <rect width="1200" height="860" fill="url(#bg)"/>

  <g opacity="0.35">
    <circle cx="70" cy="795" r="110" fill="#8fc3e8"/>
    <circle cx="1130" cy="150" r="180" fill="#d5e9f5"/>
