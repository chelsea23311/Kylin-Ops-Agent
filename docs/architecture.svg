      <rect x="80" y="58" width="18" height="18"/><rect x="108" y="58" width="18" height="18"/>
      <rect x="960" y="24" width="18" height="18"/><rect x="988" y="24" width="18" height="18"/>
      <rect x="1016" y="24" width="18" height="18"/><rect x="1044" y="24" width="18" height="18"/>
      <rect x="960" y="54" width="18" height="18"/><rect x="988" y="54" width="18" height="18"/>
      <rect x="1016" y="54" width="18" height="18"/><rect x="1044" y="54" width="18" height="18"/>
