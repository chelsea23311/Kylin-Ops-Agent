services:
  backend:
    build: .
    image: kylin-ops-agent:latest
    command:
      - python
      - -m
      - uvicorn
      - main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
    working_dir: /app/program2
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: sqlite:////app/runtime/kylin_ops.db
      BERT_SERVICE_URL: http://inference:8001/infer
      RAG_MODEL_BASE: /app/models
      SECRET_KEY: ${SECRET_KEY:?请在根目录 .env 中配置 SECRET_KEY}
      OPERATOR_REGISTER_KEY: ${OPERATOR_REGISTER_KEY:-}
      AUDITOR_REGISTER_KEY: ${AUDITOR_REGISTER_KEY:-}
      APPROVE_SECRET: ${APPROVE_SECRET:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-flash}
    volumes:
      - ./runtime:/app/runtime
      - ./data/rag_store:/app/data/rag_store
      - ./models:/app/models:ro
    depends_on:
      inference:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5).read()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  inference:
    image: kylin-ops-agent:latest
    build: .
    command:
      - python
      - -m
      - uvicorn
      - inference_service:app
      - --host
      - 0.0.0.0
      - --port
      - "8001"
    working_dir: /app
    ports:
      - "8001:8001"
    environment:
      MODEL_DIR: /app/audit_model_v1
      TRANSFORMERS_OFFLINE: "1"
      HF_HUB_OFFLINE: "1"
      HF_DATASETS_OFFLINE: "1"
    volumes:
      - ./audit_model_v1:/app/audit_model_v1:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=5).read()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: unless-stopped
